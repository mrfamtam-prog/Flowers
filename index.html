<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Flower Garden 🌸</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
<!-- ==========================================
     WELCOME SCREEN
========================================== -->

<div id="welcome-screen">

    <div class="welcome-content">

        <div class="welcome-flower">
            🌸
        </div>

        <h1>
            Welcome to My Garden
        </h1>

        <p>
            A little garden full of beautiful flowers
        </p>

        <button id="enter-button">
            Enter the Garden 🌷
        </button>

    </div>

</div>
    <div class="garden">
<!-- Magical Background Effects -->

<div class="fireflies">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="sparkles">
    <span>✦</span>
    <span>✧</span>
    <span>✦</span>
    <span>✧</span>
    <span>✦</span>
</div>

<div class="butterfly butterfly-one">🦋</div>
<div class="butterfly butterfly-two">🦋</div>
        <!-- Main Title -->
        <h1>🌸 A Little Flower Garden 🌸</h1>

        <p class="instruction">
            Tap the flower and watch what happens ✨
        </p>

        <!-- Flower Area -->
        <div id="flower-area">

            <!-- Flower will appear here -->
            <div id="flower-container"></div>

        </div>

        <!-- Flower Counter -->
        <div class="counter">
            Flower <span id="flower-number">1</span> of 5
        </div>

    </div>

    <!-- Connect JavaScript -->
    <script src="script.js"></script>

</body>
</html>
