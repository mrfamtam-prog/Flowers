<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flower Garden &#127800;</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- WELCOME SCREEN -->
    <div id="welcome-screen">
        <div class="welcome-content">
            <div class="welcome-flower">&#127800;</div>
            <h1>Welcome to My Garden</h1>
            <p>A little garden full of beautiful flowers</p>
            <button id="enter-button">Enter the Garden &#127799;</button>
        </div>
    </div>

    <!-- MAIN GARDEN -->
    <div class="garden">
        <!-- Magical Effects -->
        <div class="fireflies">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
        </div>

        <div class="sparkles">
            <span>&#10022;</span><span>&#10023;</span><span>&#10022;</span><span>&#10023;</span>
        </div>

        <!-- Flying Butterflies -->
        <div class="butterfly butterfly-one">&#129419;</div>
        <div class="butterfly butterfly-two">&#129419;</div>

        <!-- Title -->
        <h1>&#127800; A Little Flower Garden &#127800;</h1>
        <p class="instruction">Tap the flower and watch what happens &#10024;</p>

        <!-- Flower Container -->
        <div id="flower-area">
            <div id="flower-container"></div>
        </div>

        <!-- Counter -->
        <div class="counter">
            Flower <span id="flower-number">1</span> of 5
        </div>
    </div>

    <!-- JavaScript Link -->
    <script src="script.js"></script>
</body>
</html>
